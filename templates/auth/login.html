{% extends "base.html" %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center text-light auth-container">
    <div class="card glass-card p-4 p-md-5 rounded shadow-lg text-center auth-card" data-bs-theme="dark">
        <img src="{% static 'img/logo.png' %}" alt="logo">

        <h2 class="fw-medium text-primary mb-3 text-gradient">Welcome back!</h2>

        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} py-2 mb-3">{{ message }}</div>
        {% endfor %}

        <form method="post" action="" class="text-start">
            {% csrf_token %}
            {{ login_form.non_field_errors }}
            {{ login_form.as_p }}
            <button type="submit" name="login_submit" class="btn btn-primary w-100 fw-semibold">Login</button>
        </form>
        <div class="small text-light mt-3">
            New here? <a href="{% url 'register' %}" class="text-decoration-none">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
