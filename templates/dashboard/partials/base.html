<div class="dashboard-view fade-in" data-css="{% block view_css %}{% endblock %}">
    <div class="view-header d-flex justify-content-between align-items-center mb-4">
        <h4 class="view-title fw-bold text-light mb-0">{{ view_name|title }}</h4>

        <div class="view-actions">
            {% block view_actions %}{% endblock %}
        </div>
    </div>

    <div class="view-content">
        {% block view_content %}
        <!-- Specific view content goes here -->
        {% endblock %}
    </div>
</div>
